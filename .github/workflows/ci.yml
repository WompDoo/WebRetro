name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two jobs side by side: the checks report in seconds, without waiting behind the balance simulation.
  check:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the game
        run: npm run build

      - name: Upload the playable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: under-construction-${{ github.sha }}
          path: dist/under-construction.html
          retention-days: 14

  # One job per scripted player, in parallel: one job for both took 10 to 15+ minutes depending on the runner, and
  # timed out on identical code. Each job still plays a whole game.
  simulate:
    name: Balance simulation · ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [active, relaxed]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Every run is independent, so the sim spreads them over the runner's cores in worker threads.
      - name: Simulate
        run: npm run sim
        env:
          SIM_PROFILE: ${{ matrix.profile }}

  # The check keeps its old name, so anything that requires it still finds it: it passes only when every player did.
  balance:
    name: Balance simulation (every era finishable, frameworks balanced)
    needs: simulate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every player finished, with every framework balanced
        run: test "${{ needs.simulate.result }}" = "success"
