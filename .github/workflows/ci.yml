name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, test, build, simulate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the game
        run: npm run build

      - name: Balance simulation (every era must be finishable)
        run: npm run sim

      - name: Upload the playable build
        uses: actions/upload-artifact@v4
        with:
          name: under-construction-${{ github.sha }}
          path: dist/under-construction.html
          retention-days: 14
